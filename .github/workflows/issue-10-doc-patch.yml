name: Apply issue 10 documentation patch

on:
  push:
    branches:
      - docs/issue-10-development-record

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    env:
      CHANGELOG_B64: 
      LAB_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-10-development-record
      - name: Insert development record entries
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          marker = "## [MVP8-Population_Scaling-010.2] - (2026-08-17)"
          for filename, env_name in (("CHANGELOG.md", "CHANGELOG_B64"), ("LAB_NOTES.md", "LAB_B64")):
              path = Path(filename)
              text = path.read_text()
              if marker not in text:
                  raise SystemExit(f"marker missing in {filename}")
              if "MVP8-Simulation_Runner-015" in text:
                  raise SystemExit(f"entries already present in {filename}")
              entries = base64.b64decode(os.environ[env_name]).decode()
              path.write_text(text.replace(marker, entries + marker, 1))
          Path('.github/workflows/issue-10-doc-patch.yml').unlink()
          PY
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md LAB_NOTES.md .github/workflows/issue-10-doc-patch.yml
          git commit -m "docs: restore recent development record"
          git push origin HEAD:docs/issue-10-development-record
