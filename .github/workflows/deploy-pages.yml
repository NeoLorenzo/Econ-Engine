name: Deploy Econ-Engine to Pages

# PR checks gate merging. After a merge, build and smoke-test the actual main commit before publishing it;
# do not repeat the simulation suite. A manual run deploys the commit it is run on after the same smoke check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A late re-run of an older push must not replace a newer site.
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      newest: ${{ steps.commit.outputs.newest }}
    steps:
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            echo newest=true >> "$GITHUB_OUTPUT"
          else
            echo "Not deploying $SHA: main has moved on."
            echo newest=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.newest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/browser-smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
