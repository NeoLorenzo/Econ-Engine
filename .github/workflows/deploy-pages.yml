name: Deploy Econ-Engine to Pages

# The site deploys a commit on main once "Validate fast-mode browser responsiveness" has passed on it: that workflow
# runs lint, the typecheck, the build, the browser check and every test, so they are not run again here. A manual run
# deploys the commit it is run on.
on:
  workflow_run:
    workflows: [Validate fast-mode browser responsiveness]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy only a commit validated on a push to main that is still main's newest commit, so a late or re-run validation
  # of an older commit cannot put an older site back up.
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      newest: ${{ steps.commit.outputs.newest }}
    steps:
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            echo newest=true >> "$GITHUB_OUTPUT"
          else
            echo "Not deploying $SHA: main has moved on since it was validated."
            echo newest=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.newest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
