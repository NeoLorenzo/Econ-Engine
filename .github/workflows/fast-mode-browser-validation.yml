name: Validate fast-mode browser responsiveness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks. Manual full validation has its own branch-based group.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PRs run fast correctness tests and one canonical fingerprint. Run this workflow manually for the full suite,
# split three ways. `browser-check`, the status main requires, still waits for tests and the browser check.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ github.event_name == 'workflow_dispatch' && fromJSON('[1,2,3]') || fromJSON('[1]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PR correctness tests and canonical fingerprint
        if: github.event_name == 'pull_request'
        run: npm run test:ci
      - name: Full validation shard
        if: github.event_name == 'workflow_dispatch'
        run: npx vitest run --shard=${{ matrix.shard }}/3

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: ./.github/actions/browser-smoke

  # A skipped job counts as passing for a required check, so this one always runs and fails unless both succeeded.
  browser-check:
    needs: [tests, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success && test "${{ needs.browser.result }}" = success
